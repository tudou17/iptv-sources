<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#eefaf7"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#13a8a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1677ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#13a8a8"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 46px; font-weight: 700; fill: #172b4d; }
      .subtitle { font-size: 23px; fill: #5b6b82; }
      .node-title { font-size: 28px; font-weight: 700; fill: #172b4d; }
      .node-desc { font-size: 20px; fill: #62748a; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 18px; fill: #62748a; }
      .url { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 19px; fill: #185a7d; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="210" fill="#d9f7ef" opacity="0.55"/>
  <circle cx="120" cy="810" r="250" fill="#dceaff" opacity="0.55"/>

  <text x="800" y="82" text-anchor="middle" class="cn title">宽带运营商 IPTV 家庭播放拓扑</text>
  <text x="800" y="122" text-anchor="middle" class="cn subtitle">由 udpxy 将运营商 UDP/RTP 组播转换为播放器可用的 HTTP 单播</text>

  <!-- Operator -->
  <g filter="url(#shadow)">
    <rect x="70" y="250" width="300" height="220" rx="28" fill="#ffffff" stroke="#bfd4ff" stroke-width="3"/>
    <circle cx="220" cy="315" r="40" fill="#e8f1ff"/>
    <path d="M187 321 Q220 285 253 321 M198 332 Q220 308 242 332 M212 344 Q220 336 228 344" fill="none" stroke="#1677ff" stroke-width="7" stroke-linecap="round"/>
    <text x="220" y="395" text-anchor="middle" class="cn node-title">运营商 IPTV 网络</text>
    <text x="220" y="433" text-anchor="middle" class="cn node-desc">UDP / RTP 组播频道</text>
  </g>

  <!-- Modem -->
  <g filter="url(#shadow)">
    <rect x="475" y="250" width="300" height="220" rx="28" fill="#ffffff" stroke="#ffd591" stroke-width="3"/>
    <rect x="575" y="287" width="100" height="58" rx="12" fill="#fff7e6" stroke="#fa8c16" stroke-width="4"/>
    <circle cx="595" cy="316" r="5" fill="#52c41a"/>
    <circle cx="615" cy="316" r="5" fill="#52c41a"/>
    <circle cx="635" cy="316" r="5" fill="#faad14"/>
    <text x="625" y="395" text-anchor="middle" class="cn node-title">运营商光猫</text>
    <text x="625" y="433" text-anchor="middle" class="cn node-desc">IPTV 专用 LAN 口（如 LAN4）</text>
  </g>

  <!-- OpenWrt -->
  <g filter="url(#shadow)">
    <rect x="880" y="215" width="340" height="290" rx="30" fill="url(#router)"/>
    <path d="M990 290 L990 330 M1110 290 L1110 330" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <rect x="960" y="325" width="180" height="58" rx="13" fill="#ffffff" opacity="0.94"/>
    <circle cx="992" cy="354" r="6" fill="#52c41a"/>
    <circle cx="1018" cy="354" r="6" fill="#52c41a"/>
    <circle cx="1044" cy="354" r="6" fill="#52c41a"/>
    <text x="1050" y="425" text-anchor="middle" class="cn node-title" fill="#ffffff">OpenWrt 软路由</text>
    <text x="1050" y="461" text-anchor="middle" class="cn" font-size="21" fill="#e6fffb">udpxy :23234 · 组播转 HTTP 单播</text>
  </g>

  <!-- Players -->
  <g filter="url(#shadow)">
    <rect x="1325" y="250" width="210" height="220" rx="28" fill="#ffffff" stroke="#b7eb8f" stroke-width="3"/>
    <rect x="1380" y="286" width="100" height="65" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="4"/>
    <path d="M1412 368 H1448 M1430 351 V368" stroke="#52c41a" stroke-width="5" stroke-linecap="round"/>
    <text x="1430" y="405" text-anchor="middle" class="cn node-title">播放设备</text>
    <text x="1430" y="439" text-anchor="middle" class="cn node-desc">Kodi / TVBox 等</text>
  </g>

  <!-- Arrows -->
  <line x1="370" y1="360" x2="455" y2="360" stroke="#1677ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="412" y="330" text-anchor="middle" class="cn label" fill="#1677ff">组播</text>

  <line x1="775" y1="360" x2="860" y2="360" stroke="#1677ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="817" y="330" text-anchor="middle" class="cn label" fill="#1677ff">网线</text>

  <line x1="1220" y1="360" x2="1305" y2="360" stroke="#13a8a8" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1262" y="318" text-anchor="middle" class="cn label" fill="#138f8f">HTTP</text>
  <text x="1262" y="343" text-anchor="middle" class="cn small">LAN / Wi-Fi</text>

  <!-- URL card -->
  <g filter="url(#shadow)">
    <rect x="245" y="610" width="1110" height="170" rx="26" fill="#ffffff" stroke="#cfe5e2" stroke-width="2"/>
    <rect x="285" y="648" width="170" height="54" rx="27" fill="#e6fffb"/>
    <text x="370" y="683" text-anchor="middle" class="cn label" fill="#138f8f">播放器访问</text>
    <text x="485" y="684" class="url">http://路由器IP:23234/rtp/组播IP:组播端口</text>
    <line x1="285" y1="721" x2="1315" y2="721" stroke="#e8edf2" stroke-width="2"/>
    <text x="285" y="755" class="cn small">示例：http://192.168.31.1:23234/rtp/239.3.1.159:8000</text>
  </g>

  <text x="800" y="846" text-anchor="middle" class="cn small">iptv-sources · 运营商 IPTV 多局域网 IP 播放列表</text>
</svg>
